name: Bug report
description: Report a reproducible defect in the package, CLI, evaluator, or documentation
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make LoopSentry's evidence more reliable. Do not paste credentials, private prompts, or private model output. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: LoopSentry version or commit
      placeholder: v0.2.0-alpha.1 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Python API
        - CLI
        - Evaluation corpus or report
        - Packaging or installation
        - CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include configuration, equality units, command, and observed result without sensitive content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, operating system, install method
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Data handling
      options:
        - label: I have removed credentials, private prompts, and private model output.
          required: true
