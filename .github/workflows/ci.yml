name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: loopsentry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-evaluation:
    name: Quality and evaluation receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Compile
        run: python -m compileall -q src eval tests
      - name: Evaluate versioned corpus
        run: >-
          python eval/run.py
          --json-output reports/evaluation-v0.2.0.json
          --benchmark-units 20000
          --benchmark-observations 5
          --fail-on-mismatch
      - name: Upload evaluation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loopsentry-evaluation-${{ github.sha }}
          path: reports/evaluation-v0.2.0.json
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and inspect distributions
    needs: [quality-and-evaluation, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install build frontend
        run: python -m pip install build==1.3.0
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/loopsentry --version
          .smoke/bin/python -c "from loopsentry import LoopSentry; assert LoopSentry().scan(['x'] * 32)"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loopsentry-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
